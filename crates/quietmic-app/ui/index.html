<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuietMic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header with Live Voice Tester -->
    <header class="header">
      <div class="brand">
        <h1 class="brand-title">QuietMic</h1>
      </div>
      <button id="liveTestBtn" class="live-test-btn" type="button" title="Hear your voice live in headphones">
        <span class="mic-icon">🎙️</span>
        <span id="liveTestText">Test Voice</span>
      </button>
    </header>

    <!-- Microphone & Input Volume -->
    <section class="card">
      <div class="card-row">
        <label for="micSelect" class="card-label">Microphone</label>
      </div>
      <select id="micSelect" class="dropdown">
        <option value="">Default Microphone</option>
      </select>

      <div class="slider-row">
        <span class="slider-label">Mic Volume</span>
        <span id="micVolText" class="slider-val">100%</span>
      </div>
      <input type="range" id="micVolumeSlider" min="0" max="200" value="100" class="slider">

      <!-- Mic VU Meter -->
      <div class="meter-container">
        <div class="meter-bar">
          <div id="micMeterFill" class="meter-fill" style="width: 0%;"></div>
        </div>
        <span id="micMeterDb" class="meter-text">-60 dB</span>
      </div>
    </section>

    <!-- Speaker & Output Volume -->
    <section class="card">
      <div class="card-row">
        <label for="speakerSelect" class="card-label">Speaker</label>
      </div>
      <select id="speakerSelect" class="dropdown">
        <option value="">Default Speaker / Headphones</option>
      </select>

      <div class="slider-row">
        <span class="slider-label">Speaker Volume</span>
        <span id="speakerVolText" class="slider-val">100%</span>
      </div>
      <input type="range" id="speakerVolumeSlider" min="0" max="100" value="100" class="slider">
    </section>

    <!-- Automatic Adjust Input Sensitivity -->
    <section class="card">
      <div class="toggle-row">
        <span class="card-label">Auto-Adjust Sensitivity</span>
        <label class="switch">
          <input type="checkbox" id="autoSensitivityToggle" checked>
          <span class="slider-round"></span>
        </label>
      </div>
      <div id="manualSensitivitySection" class="slider-section disabled">
        <div class="slider-row">
          <span class="slider-label">Threshold</span>
          <span id="sensitivityText" class="slider-val">-50 dB</span>
        </div>
        <input type="range" id="sensitivitySlider" min="-80" max="-10" value="-50" class="slider" disabled>
      </div>
    </section>

    <!-- Noise Suppression: Krisp, Standard, None -->
    <section class="card">
      <span class="card-label">Noise Suppression</span>
      <div class="segmented-control">
        <button type="button" class="seg-btn active" data-mode="Krisp">Krisp</button>
        <button type="button" class="seg-btn" data-mode="Standard">Standard</button>
        <button type="button" class="seg-btn" data-mode="None">None</button>
      </div>
    </section>

    <!-- Echo Cancellation (AEC) -->
    <section class="card">
      <div class="toggle-row">
        <span class="card-label">Echo Cancellation</span>
        <label class="switch">
          <input type="checkbox" id="aecToggle">
          <span class="slider-round"></span>
        </label>
      </div>
    </section>

    <!-- Push to Talk -->
    <section class="card">
      <div class="toggle-row">
        <span class="card-label">Push to Talk</span>
        <label class="switch">
          <input type="checkbox" id="pttToggle">
          <span class="slider-round"></span>
        </label>
      </div>
      <div id="pttControls" class="ptt-controls disabled">
        <div class="ptt-row">
          <span class="slider-label">Shortcut:</span>
          <button type="button" id="pttKeyBtn" class="key-bind-btn">Space</button>
          <span id="pttStatusBadge" class="ptt-status">Muted</span>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
