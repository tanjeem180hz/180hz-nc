[package]
name = "quietmic-app"
version = "0.1.0"
edition = "2021"
authors = ["QuietMic Engineering Team"]
description = "QuietMic - Real-time AI noise cancellation for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quietmic-core = { path = "../quietmic-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading"
] }
