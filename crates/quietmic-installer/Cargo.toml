[package]
name = "quietmic-installer"
version = "1.0.0"
edition = "2021"
authors = ["180Hz Engineering Team"]
description = "All-in-One Automated Installer for 180Hz NC and Virtual Audio Cable"

[[bin]]
name = "180Hz-NC-Setup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com"
] }
