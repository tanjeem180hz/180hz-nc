[workspace]
members = [
    "crates/quietmic-core",
    "crates/quietmic-bench",
    "crates/quietmic-app",
    "crates/quietmic-installer",
    "crates/quietmic-launcher",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# strip = true with MinGW GNU ld + fat LTO corrupts .init_array (0xC0000005 before main)
strip = "none"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1


